<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Club Shift Manager{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f3f5f9;
            color: #1d2736;
        }
        a { color: #1c5ed8; text-decoration: none; }
        .container {
            max-width: 1180px;
            margin: 0 auto;
            padding: 24px 16px 40px;
        }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f172a;
            color: white;
            padding: 14px 18px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        nav strong { font-size: 1.2rem; }
        nav .links { display: flex; gap: 18px; }
        .card, .panel, .status-line, .stats .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 10px rgba(15,23,42,0.06);
            padding: 18px;
        }
        .stack-form, .filter-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        label { display: flex; flex-direction: column; gap: 6px; font-weight: 600; }
        input, select, button {
            border-radius: 8px;
            border: 1px solid #d6dbe3;
            padding: 10px 12px;
            font-size: 1rem;
        }
        button {
            background: #2563eb;
            color: white;
            font-weight: 700;
            cursor: pointer;
            border: none;
        }
        button.secondary {
            background: #e5e7eb;
            color: #111827;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 12px;
            margin: 18px 0;
        }
        .stats .card .label { color: #52607a; font-size: 0.85rem; }
        .stats .card .value { font-size: 1.7rem; font-weight: 700; margin-top: 6px; }
        .panel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin: 24px 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
        }
        th, td {
            border-bottom: 1px solid #e5e7eb;
            padding: 10px 8px;
            text-align: left;
            vertical-align: top;
        }
        th { background: #eef2ff; }
        .error-message { color: #b42318; font-weight: 700; }
        .badge {
            display: inline-block;
            border-radius: 999px;
            padding: 5px 8px;
            font-size: 0.8rem;
            font-weight: 700;
        }
        .badge.active { background: #dcfce7; color: #166534; }
        .badge.completed { background: #dbeafe; color: #1d4ed8; }
        .inline-fields {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        @media (max-width: 760px) {
            .inline-fields { grid-template-columns: 1fr; }
            nav { flex-direction: column; align-items: flex-start; gap: 12px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <strong>Club Shift Manager</strong>
            <div class="links">
                <a href="/manager">Руководитель</a>
                <a href="/login">Сотрудники</a>
            </div>
        </nav>
        {% block content %}{% endblock %}
    </div>
</body>
</html>
